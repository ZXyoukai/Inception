services:
  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    image: mariadb
    restart: always
    env_file:
      - .env
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - wp_db
    secrets:
      - db_password
      - db_root_password

  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress
    image: wordpress
    restart: always
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - wp_db
      - nginx_vol
    depends_on:
      - mariadb
    secrets:
      - credentials
      - wordpress_admin_password
      - db_password
      - db_root_password
    

  nginx:
    container_name: nginx
    build: ./requirements/nginx
    image: nginx
    restart: always
    ports:
      - "443:443"
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html
      - adminer_data:/var/www/adminer
    networks:
      - nginx_vol
    depends_on:
      - wordpress

  redis:
    container_name: redis
    build: ./requirements/bonus/redis
    image: redis
    restart: always
    networks:
      - wp_db
    volumes:
      - redis_data:/data

  ftp:
    container_name: ftp
    build: ./requirements/bonus/ftp
    image: ftp
    restart: always
    ports:
      - "21:21"
      - "21000-21010:21000-21010"
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - nginx_vol
    depends_on:
      - wordpress

  adminer:
    container_name: adminer
    build: ./requirements/bonus/adminer
    image: adminer
    restart: always
    volumes:
      - adminer_data:/var/www/html
    networks:
      - wp_db
      - nginx_vol
    depends_on:
      - mariadb

  static-site:
    container_name: static-site
    build: ./requirements/bonus/static-site
    image: static-site
    restart: always
    ports:
      - "8080:80"
    networks:
      - nginx_vol

  portainer:
    container_name: portainer
    build: ./requirements/bonus/portainer
    image: portainer
    restart: always
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - nginx_vol

networks:
  nginx_vol:
    driver: bridge
  wp_db:
    driver: bridge

volumes:
  mariadb_data:
    name: mariadb_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mariadb
  wordpress_data:
    name: wordpress_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/wordpress
  redis_data:
    name: redis_data
    driver: local
  adminer_data:
    name: adminer_data
    driver: local
  portainer_data:
    name: portainer_data
    driver: local

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt
  wordpress_admin_password:
    file: ../secrets/wordpress_admin_password
  
    