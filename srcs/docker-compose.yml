version: "3.8"

services:
  mariadb:
    container_name: mariadb
    build: ./MariaDB
    restart: always
    env_file:
      - .env
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - wp_db

  wordpress:
    container_name: wordpress
    build: ./WordPress
    restart: always
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - wp_db
      - nginx_vol
    depends_on:
      - mariadb

  nginx:
    container_name: nginx
    build: ./Nginx
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - nginx_vol
    depends_on:
      - wordpress

networks:
  nginx_vol:
    driver: bridge
  wp_db:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/dgermano/data/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/dgermano/data/wordpress
      #       - db_data:/var/lib/mysql

    