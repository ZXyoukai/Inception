
server {
    listen 80;
    server_name dgermano.42.fr;

    root /var/www/html;
    # index index.php index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Proxy para o site da 42
    location /intra {
        proxy_pass https://42.fr;
        proxy_set_header Host 42.fr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    location ~ \.php$ {
        root /var/www/html;
        include fastcgi.conf;
        fastcgi_pass wordpress:9001;
    }

    # Bloquear ficheiros ocultos (.htaccess, .htpasswd)
    # location ~ /\. {
    #     deny all;
    # }
}
